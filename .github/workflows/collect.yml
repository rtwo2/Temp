      - name: Commit & Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add sub/everything.txt \
                  sub/everything.top1000.txt \
                  sub/protocols/ \
                  sub/countries/ \
                  sub/continents/ \
                  ProxyCollector/GeoLite2-Country.mmdb || true

          git fetch origin main
          git diff --cached --quiet && echo "Nothing staged" && exit 0

          PROXY_COUNT=$(wc -l < sub/everything.txt 2>/dev/null || echo 0)
          git commit -m "Fresh proxies - $(date +'%Y-%m-%d %H:%M UTC') - ${PROXY_COUNT} proxies" || echo "Nothing to commit"

          git push origin HEAD:main --force-with-lease || git push origin HEAD:main --force || echo "Push failed"
